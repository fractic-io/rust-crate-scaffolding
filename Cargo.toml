[package]
name = "fractic-crate-scaffolding"
version = "0.1.0"
authors = ["Mart van Buren <mart@fractic.io>"]
edition = "2024"

[workspace]
members = ["macros", "protocol"]

[dependencies]
fractic-crate-scaffolding-macros = { version = "0.1.0", path = "macros" }
fractic-repository-protocol = { version = "0.1.0", path = "protocol" }

[dev-dependencies]
async-trait = "^0.1.68"
fractic-server-error = { git = "https://github.com/fractic-io/rust-server-error.git" }
serde = { version = "^1.0.203", features = ["derive"] }
serde_json = "^1.0.117"
tokio = { version = "^1", features = ["macros", "rt"] }
